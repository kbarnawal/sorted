<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Message Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .error-text {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Secure Message Portal</h2>
        <div id="portal-content">
            <p>Click below to verify your credentials and view your message.</p>
            <button class="btn" onclick="verifyAndPlay()">Enter Portal</button>
        </div>
    </div>

    <audio id="popup-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-600.wav" preload="auto"></audio>

    <script>
        function verifyAndPlay() {
            // 1. Fetch the user token from the URL bar
            const urlParams = new URLSearchParams(window.location.search);
            let passedKey = urlParams.get('user');

            // 2. Testing Fallback: Default to Ted if no key is entered in the URL
            if (!passedKey) {
                passedKey = "ted-c3c";
            }

            const contentDiv = document.getElementById('portal-content');
            const sound = document.getElementById('popup-sound');

            // 3. Authorized User Database Mapping
            const authorizedUsers = {
                "ted-c3d": "twodoslawsky@c3digitus.com",
                "ted-c3c": "twodoslawsky@c3controls.com",
                "abhiram-gp": "abhirampillai504pk@gmail.com",
                "kunal-c3d": "kbarnawal@c3digitus.com",
                "kunal-c3c": "kbarnawal@c3controls.com"
            };

            // 4. Validate and Execute Actions cleanly
            if (authorizedUsers[passedKey]) {
                
                // Play audio safely
                sound.play();

                // Wait exactly 350ms for the sound to trigger before the alert freezes the page
                setTimeout(function() {
                    alert("Please be patient, Ted and come back on Tuesday!");
                }, 350);
                
            } else {
                // Displays on-screen restriction if an illegal key token is typed
                contentDiv.innerHTML = "<p class='error-text'>Access Denied.<br>Invalid security key token.</p>";
            }
        }
    </script>

</body>
</html>
