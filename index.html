<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Message Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Message Portal</h2>
        <div id="portal-content">
            <p>Click below to open your message.</p>
            <button class="btn" onclick="openPortal()">Enter Portal</button>
        </div>
    </div>

    <audio id="popup-sound" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" preload="auto"></audio>

    <script>
        function openPortal() {
            const sound = document.getElementById('popup-sound');

            // 1. Play audio track cleanly
            sound.play().catch(function(err) {
                console.log("Audio waiting for user click.");
            });

            // 2. Deliver the notification pop-up instantly
            setTimeout(function() {
                alert("Please be patient, Ted and come back on Tuesday!");
            }, 100);
        }
    </script>

</body>
</html>
